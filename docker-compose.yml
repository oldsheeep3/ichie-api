version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: surechigai-mysql
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-surechigai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-surechigai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-surechigai}
    volumes:
      - mysql_data:/var/lib/mysql
      # initialize DB with our create_tables_mysql.sql on first run
      - ./db/create_tables_mysql.sql:/docker-entrypoint-initdb.d/create_tables.sql:ro
    ports:
      - '${DB_PORT:-3306}:3306'
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u ${MYSQL_USER:-surechigai} -p${MYSQL_PASSWORD:-surechigai}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: surechigai-phpmyadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-surechigai}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-surechigai}
    ports:
      - '${PHPMYADMIN_PORT:-8080}:80'
    depends_on:
      - mysql
    volumes:
      - phpmyadmin_data:/etc/phpmyadmin

volumes:
  mysql_data:
  phpmyadmin_data:
